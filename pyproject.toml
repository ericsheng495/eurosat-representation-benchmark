[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eurosat-representation-benchmark"
version = "0.1.0"
description = "Frozen CNN and Transformer representations for few-shot EuroSAT classification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.6,<3", "torchvision>=0.21,<1", "numpy>=1.26,<3",
  "scikit-learn>=1.4,<1.8", "Pillow>=10,<13", "matplotlib>=3.8,<4",
  "pandas>=2.2,<3", "seaborn>=0.13,<0.14"
]

[project.scripts]
eurosat = "eurosat.cli:main"

[project.optional-dependencies]
notebook = ["nbformat>=5.10,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8"]

[tool.setuptools.packages.find]
where = ["src"]
